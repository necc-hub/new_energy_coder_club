name: "🌱 Good first issue"
description: "发布一个有明确文件、验收标准和验证命令的新人任务"
title: "[gfi] "
labels: ["good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        只发布新人可在 2 小时内完成、不依赖昂贵硬件且有明确验收标准的任务。带教人在认领后提供必要上下文。
  - type: textarea
    id: background
    attributes:
      label: 背景与目标
      description: 为什么需要这个任务，完成后对谁有帮助？
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: 涉及文件
      description: 列出需要修改的具体文件路径，避免只写“优化文档”。
      placeholder: |
        - docs/example.md
        - projects/example/README.md
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 完成标准
      description: 使用可勾选的、可观察的交付标准。
      placeholder: |
        - [ ] 修正指定链接
        - [ ] 补充一段常见问题
        - [ ] 不改变现有命令行为
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 验证命令或方法
      render: bash
      placeholder: |
        python3 .github/scripts/check_links.py path/to/file.md
        python3 docs/nec-quickstart/hello_nec.py --seconds 2
    validations:
      required: true
  - type: dropdown
    id: estimate
    attributes:
      label: 预计耗时
      options:
        - 30 分钟以内
        - 30–60 分钟
        - 1–2 小时
    validations:
      required: true
  - type: input
    id: mentor
    attributes:
      label: 带教人
      description: 填 GitHub ID；暂未确定可写“维护者认领后指定”。
    validations:
      required: true
